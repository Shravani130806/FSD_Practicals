services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5001
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusconnect-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
